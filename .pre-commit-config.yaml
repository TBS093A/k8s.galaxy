# Local quality gate: `pip install pre-commit && pre-commit install`
# The same checks run in CI (see .github/workflows/ci.yml and security.yml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^docs/screenshots/
      - id: trailing-whitespace
        exclude: ^docs/screenshots/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (warnings are errors)
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: private-patterns
        name: no private words (patterns from git-ignored .private-patterns)
        entry: python3 scripts/check_private_patterns.py
        language: system
        types: [text]
