[package]
name = "k8s-galaxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal command center for Kubernetes: geo map, galaxy and radar views, rollouts, traffic, RBAC, Argo CD and storage"
license = "MIT"
repository = "https://github.com/TBS093A/k8s.galaxy"
readme = "README.md"
keywords = ["kubernetes", "tui", "dashboard", "ratatui", "devops"]
categories = ["command-line-utilities", "visualization"]
# Screenshots stay on GitHub; the published crate only needs the sources.
exclude = ["docs/", ".github/", "scripts/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
http = "1.5.0"
json-patch = "4"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["aws-lc-rs", "client", "rustls-tls", "jsonpatch", "runtime"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[profile.dev]
debug = 0

[dev-dependencies]
proptest = "1"
