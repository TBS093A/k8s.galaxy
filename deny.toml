# cargo-deny: supply-chain policy checked in the Security workflow (job "sca").

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable, unmaintained and yanked crates fail the check.
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with distributing an MIT binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
