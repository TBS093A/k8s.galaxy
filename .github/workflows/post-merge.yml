# After a merge to main: build every target, verify the binaries, keep them as artifacts and
# (once enabled) refresh the "nightly" pre-release. Real releases come from tags: release.yml.
name: Post-merge

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: post-merge
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      artifact-prefix: nightly
      dev: true

  nightly:
    name: refresh the nightly pre-release
    needs: build
    # Enable with: gh variable set NIGHTLY_RELEASE --body true (docs/RELEASING.md)
    if: vars.NIGHTLY_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the nightly tag, replace the assets
      id-token: write # sign the provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/* --repo "$REPO" --target "$SHA" --prerelease \
            --title "nightly" --notes "Development build of ${SHA::7} (main). Not a release."
